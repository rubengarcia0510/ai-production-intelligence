spring.application.name=ai-production-intelligence

spring.datasource.url=${CLICKHOUSE_JDBC_URL:jdbc:ch:http://localhost:8123/production}
spring.datasource.username=${CLICKHOUSE_JDBC_USERNAME:default}
spring.datasource.password=${CLICKHOUSE_JDBC_PASSWORD:}
spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

clickhouse.startup-check.enabled=${CLICKHOUSE_STARTUP_CHECK_ENABLED:true}

mcp.clickhouse.enabled=${MCP_CLICKHOUSE_ENABLED:false}
